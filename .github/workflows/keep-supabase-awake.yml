name: Keep Supabase awake

# Free Supabase projects are paused after about a week without database activity.
# This asks the database for one row every day so the project stays active.
# It uses only the public (publishable) key that the website already sends to every visitor's browser.
# If the project ever gets paused, this job fails and GitHub emails you.

on:
  schedule:
    - cron: "17 6 * * *" # every day at 06:17 UTC
  workflow_dispatch: # lets you press "Run workflow" by hand in the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one product from Supabase
        run: |
          curl --fail --silent --show-error --max-time 30 --retry 3 --retry-delay 10 \
            "https://priamuoqwdprnnniutlc.supabase.co/rest/v1/products?select=id&limit=1" \
            -H "apikey: sb_publishable_6sbioGrGAKydN57vMkhzZw_83CHBcEh"
